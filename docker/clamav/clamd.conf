# ClamAV daemon configuration (RF-016, F-05)
# Ajustado para permitir escaneo de archivos de evidencia de hasta 25 MB.
# IMPORTANTE: este archivo debe usar finales de linea LF (Unix). clamd
# rechaza valores con \r y no arranca ("Incorrect argument format"). Ver
# .gitattributes.

LogFile /var/log/clamav/clamd.log
LogSyslog yes
PidFile /var/run/clamav/clamd.pid
TemporaryDirectory /var/tmp
DatabaseDirectory /var/lib/clamav
LocalSocket /var/run/clamav/clamd.ctl
TCPSocket 3310

# Tamaño máximo de stream para INSTREAM (debe ser >= 25 MB = tamano max de archivo)
StreamMaxLength 25M

MaxConnectionQueueLength 15
IdleTimeout 120
MaxThreads 5
ReadTimeout 300
#SendBufSize 262144

MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 200
PCREMatchLimit 100000
PCRERecMatchLimit 5000
PCREMaxFileSize 25M

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
