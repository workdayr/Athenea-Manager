[project]
name = "athenea-ai-service"
version = "0.1.0"
description = "Microservicio RAG local (Ollama + pgvector) para Athenea Manager"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "pypdf>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
