services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://research_admin:${DB_PASSWORD}@postgres:5432/research_platform"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # El proxy /api/auth/* de Next (rewrites) reenvia aqui. Dentro de la
      # red de Compose el backend se alcanza por su nombre de servicio.
      BACKEND_URL: http://api:3001
    env_file:
      - ./frontend/.env
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    # Imagen con la extension pgvector preinstalada (requerida por
    # prisma/schema.prisma: datasource extensions = [vector]).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: research_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: research_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_admin -d research_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: